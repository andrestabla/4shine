<svg viewBox="0 0 960 540" width="100%" role="img" aria-label="Recorrido del programa 4Shine" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8CE86"/>
      <stop offset="1" stop-color="#D4AF37"/>
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect x="0" y="0" width="960" height="540" fill="#FFFFFF"/>

  <!-- Encabezado -->
  <g font-family="Manrope, ui-sans-serif, system-ui, sans-serif">
    <text x="60" y="62" font-size="27" font-weight="700" fill="#0D1B2A">El recorrido 4Shine<tspan font-weight="400" fill="#64748B"> — 5 fases</tspan></text>
    <!-- Diamante de marca junto al titulo -->
    <path d="M 933 46 L 946 59 L 933 72 L 920 59 Z" fill="#D4AF37"/>
    <path d="M 933 51 L 942 59 L 933 67 L 924 59 Z" fill="#E8CE86"/>
  </g>

  <!-- Linea de tiempo con nodos -->
  <line x1="106" y1="150" x2="854" y2="150" stroke="url(#goldLine)" stroke-width="3"/>

  <!-- ================= ESTACIONES + TARJETAS ================= -->
  <!-- Posiciones centrales de las 5 estaciones: 106, 293, 480, 667, 854 -->

  <!-- === FASE 1 === -->
  <g font-family="Manrope, ui-sans-serif, system-ui, sans-serif">
    <circle cx="106" cy="150" r="22" fill="#D4AF37"/>
    <circle cx="106" cy="150" r="22" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <text x="106" y="158" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>

    <rect x="44" y="196" width="164" height="256" rx="13" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/>
    <path d="M 62 220 L 68 226 L 62 232 L 56 226 Z" fill="#D4AF37"/>
    <text x="80" y="230" font-size="11.5" font-weight="600" fill="#64748B">Semana 1</text>
    <text x="62" y="266" font-size="17" font-weight="700" fill="#0D1B2A">Descubrimiento</text>

    <rect x="62" y="284" width="76" height="24" rx="10" fill="#0D1B2A"/>
    <text x="100" y="300" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Diagnóstico</text>

    <text x="62" y="342" font-size="12.5" fill="#64748B">Diagnóstico de</text>
    <text x="62" y="360" font-size="12.5" fill="#64748B">liderazgo con IA</text>
    <text x="62" y="378" font-size="12.5" fill="#64748B">(radar por</text>
    <text x="62" y="396" font-size="12.5" fill="#64748B">pilares).</text>
  </g>

  <!-- === FASE 2 === -->
  <g font-family="Manrope, ui-sans-serif, system-ui, sans-serif">
    <circle cx="293" cy="150" r="22" fill="#D4AF37"/>
    <circle cx="293" cy="150" r="22" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <text x="293" y="158" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>

    <rect x="231" y="196" width="164" height="256" rx="13" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/>
    <path d="M 249 220 L 255 226 L 249 232 L 243 226 Z" fill="#D4AF37"/>
    <text x="267" y="230" font-size="11.5" font-weight="600" fill="#64748B">WB1–WB3</text>
    <text x="249" y="266" font-size="17" font-weight="700" fill="#0D1B2A">Shine Within</text>

    <rect x="249" y="284" width="40" height="24" rx="10" fill="#FFFFFF" stroke="#D4AF37" stroke-width="1.3"/>
    <text x="269" y="300" font-size="11" font-weight="700" fill="#0D1B2A" text-anchor="middle">WB1</text>
    <rect x="295" y="284" width="40" height="24" rx="10" fill="#FFFFFF" stroke="#D4AF37" stroke-width="1.3"/>
    <text x="315" y="300" font-size="11" font-weight="700" fill="#0D1B2A" text-anchor="middle">WB2</text>
    <rect x="341" y="284" width="40" height="24" rx="10" fill="#FFFFFF" stroke="#D4AF37" stroke-width="1.3"/>
    <text x="361" y="300" font-size="11" font-weight="700" fill="#0D1B2A" text-anchor="middle">WB3</text>

    <text x="249" y="342" font-size="12.5" fill="#64748B">Creencias, identidad,</text>
    <text x="249" y="360" font-size="12.5" fill="#64748B">gestión emocional,</text>
    <text x="249" y="378" font-size="12.5" fill="#64748B">propósito y valores.</text>
  </g>

  <!-- === FASE 3 === -->
  <g font-family="Manrope, ui-sans-serif, system-ui, sans-serif">
    <circle cx="480" cy="150" r="22" fill="#D4AF37"/>
    <circle cx="480" cy="150" r="22" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <text x="480" y="158" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>

    <rect x="418" y="196" width="164" height="256" rx="13" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/>
    <path d="M 436 220 L 442 226 L 436 232 L 430 226 Z" fill="#D4AF37"/>
    <text x="454" y="230" font-size="11.5" font-weight="600" fill="#64748B">WB4–WB6</text>
    <text x="436" y="266" font-size="17" font-weight="700" fill="#0D1B2A">Shine Out</text>

    <rect x="436" y="284" width="40" height="24" rx="10" fill="#FFFFFF" stroke="#D4AF37" stroke-width="1.3"/>
    <text x="456" y="300" font-size="11" font-weight="700" fill="#0D1B2A" text-anchor="middle">WB4</text>
    <rect x="482" y="284" width="40" height="24" rx="10" fill="#FFFFFF" stroke="#D4AF37" stroke-width="1.3"/>
    <text x="502" y="300" font-size="11" font-weight="700" fill="#0D1B2A" text-anchor="middle">WB5</text>
    <rect x="528" y="284" width="40" height="24" rx="10" fill="#FFFFFF" stroke="#D4AF37" stroke-width="1.3"/>
    <text x="548" y="300" font-size="11" font-weight="700" fill="#0D1B2A" text-anchor="middle">WB6</text>

    <text x="436" y="342" font-size="12.5" fill="#64748B">Narrativa profesional,</text>
    <text x="436" y="360" font-size="12.5" fill="#64748B">comunicación ejecutiva,</text>
    <text x="436" y="378" font-size="12.5" fill="#64748B">lenguaje verbal y</text>
    <text x="436" y="396" font-size="12.5" fill="#64748B">no verbal.</text>
  </g>

  <!-- === FASE 4 === -->
  <g font-family="Manrope, ui-sans-serif, system-ui, sans-serif">
    <circle cx="667" cy="150" r="22" fill="#D4AF37"/>
    <circle cx="667" cy="150" r="22" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <text x="667" y="158" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>

    <rect x="605" y="196" width="164" height="256" rx="13" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/>
    <path d="M 623 220 L 629 226 L 623 232 L 617 226 Z" fill="#D4AF37"/>
    <text x="641" y="230" font-size="11.5" font-weight="600" fill="#64748B">WB7–WB8</text>
    <text x="623" y="266" font-size="17" font-weight="700" fill="#0D1B2A">Shine Up</text>

    <rect x="623" y="284" width="40" height="24" rx="10" fill="#FFFFFF" stroke="#D4AF37" stroke-width="1.3"/>
    <text x="643" y="300" font-size="11" font-weight="700" fill="#0D1B2A" text-anchor="middle">WB7</text>
    <rect x="669" y="284" width="40" height="24" rx="10" fill="#FFFFFF" stroke="#D4AF37" stroke-width="1.3"/>
    <text x="689" y="300" font-size="11" font-weight="700" fill="#0D1B2A" text-anchor="middle">WB8</text>

    <text x="623" y="342" font-size="12.5" fill="#64748B">Mapeo estratégico,</text>
    <text x="623" y="360" font-size="12.5" fill="#64748B">pensamiento y</text>
    <text x="623" y="378" font-size="12.5" fill="#64748B">toma de decisiones.</text>
  </g>

  <!-- === FASE 5 === -->
  <g font-family="Manrope, ui-sans-serif, system-ui, sans-serif">
    <circle cx="854" cy="150" r="22" fill="#D4AF37"/>
    <circle cx="854" cy="150" r="22" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <text x="854" y="158" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>

    <rect x="752" y="196" width="164" height="256" rx="13" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/>
    <path d="M 770 220 L 776 226 L 770 232 L 764 226 Z" fill="#D4AF37"/>
    <text x="788" y="230" font-size="11.5" font-weight="600" fill="#64748B">WB9–WB10</text>
    <text x="770" y="266" font-size="17" font-weight="700" fill="#0D1B2A">Shine Beyond</text>

    <rect x="770" y="284" width="40" height="24" rx="10" fill="#FFFFFF" stroke="#D4AF37" stroke-width="1.3"/>
    <text x="790" y="300" font-size="11" font-weight="700" fill="#0D1B2A" text-anchor="middle">WB9</text>
    <rect x="816" y="284" width="46" height="24" rx="10" fill="#FFFFFF" stroke="#D4AF37" stroke-width="1.3"/>
    <text x="839" y="300" font-size="11" font-weight="700" fill="#0D1B2A" text-anchor="middle">WB10</text>

    <text x="770" y="342" font-size="12.5" fill="#64748B">Latido de marca,</text>
    <text x="770" y="360" font-size="12.5" fill="#64748B">visión estratégica</text>
    <text x="770" y="378" font-size="12.5" fill="#64748B">personal.</text>
  </g>

  <!-- Nota al pie -->
  <g font-family="Manrope, ui-sans-serif, system-ui, sans-serif">
    <path d="M 60 496 L 66 502 L 60 508 L 54 502 Z" fill="#D4AF37"/>
    <text x="78" y="507" font-size="12.5" font-weight="500" fill="#64748B">~10 semanas · avance sincronizado en workbooks, diagnóstico y mentorías.</text>
  </g>
</svg>
