<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" role="img" aria-label="Como se decide el acceso en 4Shine: el permiso de rol (tabla role_module_permissions) y el gating por plan (tabla plan_module_features) convergen en el Acceso efectivo. Para un lider el acceso es el permiso de rol Y lo que su plan habilita; los roles no-lider no se limitan por plan; el invitado solo accede a Descubrimiento.">
  <defs>
    <style>text{font-family:Manrope, ui-sans-serif, system-ui, sans-serif;}</style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#0D1B2A"/>
    </marker>
  </defs>

  <!-- Fondo -->
  <rect x="0" y="0" width="900" height="480" fill="#FFFFFF"/>

  <!-- Cabecera -->
  <rect x="24" y="18" width="852" height="58" rx="12" fill="#0D1B2A"/>
  <text x="44" y="47" font-size="21" font-weight="700" fill="#FFFFFF">Como se decide el acceso</text>
  <text x="44" y="66" font-size="12.5" font-weight="500" fill="#E8CE86">Permiso de rol combinado con gating por plan = Acceso efectivo</text>

  <!-- Entrada A: Permiso de ROL -->
  <g>
    <rect x="40" y="112" width="300" height="128" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="40" y="112" width="300" height="34" rx="12" fill="#1A1F2B"/>
    <rect x="40" y="130" width="300" height="16" fill="#1A1F2B"/>
    <text x="60" y="134" font-size="13.5" font-weight="700" fill="#FFFFFF">A · Permiso de ROL</text>
    <text x="60" y="170" font-size="11.5" font-weight="600" fill="#0D1B2A">app_auth.role_module_permissions</text>
    <text x="60" y="192" font-size="11" font-weight="500" fill="#64748B">Define, por rol y modulo, las acciones</text>
    <text x="60" y="208" font-size="11" font-weight="500" fill="#64748B">permitidas:</text>
    <text x="60" y="228" font-size="10.5" font-weight="600" fill="#D4AF37">view · create · update · delete</text>
    <text x="60" y="243" font-size="10.5" font-weight="600" fill="#D4AF37">approve · moderate · manage</text>
  </g>

  <!-- Entrada B: Gating por PLAN -->
  <g>
    <rect x="40" y="264" width="300" height="128" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <rect x="40" y="264" width="300" height="34" rx="12" fill="#1A1F2B"/>
    <rect x="40" y="282" width="300" height="16" fill="#1A1F2B"/>
    <text x="60" y="286" font-size="13.5" font-weight="700" fill="#FFFFFF">B · Gating por PLAN</text>
    <text x="60" y="322" font-size="11.5" font-weight="600" fill="#0D1B2A">app_billing.plan_module_features</text>
    <text x="60" y="344" font-size="11" font-weight="500" fill="#64748B">Que modulos y cuotas incluye la</text>
    <text x="60" y="360" font-size="11" font-weight="500" fill="#64748B">suscripcion contratada.</text>
    <text x="60" y="380" font-size="10.5" font-weight="600" fill="#D4AF37">p. ej. 10 mentorias 1:1</text>
  </g>

  <!-- Operador Y -->
  <g>
    <circle cx="470" cy="252" r="26" fill="#F4F6F9" stroke="#D4AF37" stroke-width="2"/>
    <text x="470" y="250" font-size="16" font-weight="700" fill="#0D1B2A" text-anchor="middle">Y</text>
    <text x="470" y="266" font-size="9" font-weight="600" fill="#64748B" text-anchor="middle">(AND)</text>
  </g>

  <!-- Flechas de entrada al operador -->
  <path d="M 340 176 L 428 240" stroke="#0D1B2A" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M 340 328 L 428 264" stroke="#0D1B2A" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- Flecha operador -> Acceso efectivo -->
  <path d="M 496 252 L 588 252" stroke="#0D1B2A" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Caja dorada: Acceso efectivo -->
  <g>
    <rect x="600" y="188" width="264" height="128" rx="12" fill="#D4AF37"/>
    <rect x="600" y="188" width="264" height="128" rx="12" fill="none" stroke="#E8CE86" stroke-width="2"/>
    <text x="732" y="228" font-size="17" font-weight="700" fill="#0D1B2A" text-anchor="middle">Acceso efectivo</text>
    <text x="732" y="256" font-size="11.5" font-weight="600" fill="#0D1B2A" text-anchor="middle">Lo que el usuario realmente</text>
    <text x="732" y="273" font-size="11.5" font-weight="600" fill="#0D1B2A" text-anchor="middle">puede ver y hacer en cada modulo</text>
    <text x="732" y="298" font-size="10.5" font-weight="600" fill="#1A1F2B" text-anchor="middle">Rol permite · Plan habilita</text>
  </g>

  <!-- Nota de suma por compras puntuales -->
  <g>
    <rect x="600" y="330" width="264" height="42" rx="10" fill="#F4F6F9" stroke="#E2E8F0"/>
    <circle cx="622" cy="351" r="8" fill="#16A34A"/>
    <path d="M 618.5 351 L 621 353.5 L 625.5 348.5" stroke="#FFFFFF" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="640" y="348" font-size="10.5" font-weight="600" fill="#0D1B2A">Las compras puntuales</text>
    <text x="640" y="363" font-size="10.5" font-weight="500" fill="#64748B">SUMAN acceso (nunca lo restan)</text>
  </g>

  <!-- Reglas al pie -->
  <rect x="40" y="410" width="824" height="52" rx="10" fill="#0D1B2A"/>
  <text x="60" y="432" font-size="11.5" font-weight="700" fill="#E8CE86">Reglas</text>

  <circle cx="124" cy="428" r="3" fill="#D4AF37"/>
  <text x="134" y="432" font-size="11" font-weight="500" fill="#FFFFFF">LIDER: acceso = permiso de rol Y lo que su plan habilita.</text>

  <circle cx="500" cy="428" r="3" fill="#D4AF37"/>
  <text x="510" y="432" font-size="11" font-weight="500" fill="#FFFFFF">No-lider (gestor / advisor / admin): NO se limitan por plan.</text>

  <circle cx="124" cy="450" r="3" fill="#D4AF37"/>
  <text x="134" y="454" font-size="11" font-weight="500" fill="#FFFFFF">Compras puntuales del lider SUMAN modulos o cuotas.</text>

  <circle cx="500" cy="450" r="3" fill="#D4AF37"/>
  <text x="510" y="454" font-size="11" font-weight="500" fill="#FFFFFF">INVITADO: acceso restringido solo a Descubrimiento.</text>
</svg>
