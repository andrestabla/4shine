      <text x="757" y="185">Zoom</text>
      <text x="757" y="199" font-size="10.5" font-weight="500" fill="#64748B">reuniones + grabación</text>

      <rect x="744" y="212" width="168" height="38" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="757" y="231">Stripe / Wompi</text>
      <text x="757" y="245" font-size="10.5" font-weight="500" fill="#64748B">pagos</text>

      <rect x="744" y="258" width="168" height="38" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="757" y="277">Pusher</text>
      <text x="757" y="291" font-size="10.5" font-weight="500" fill="#64748B">tiempo real</text>

      <rect x="744" y="304" width="168" height="38" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="757" y="323">Nodemailer / SMTP</text>
      <text x="757" y="337" font-size="10.5" font-weight="500" fill="#64748B">email</text>

      <rect x="744" y="350" width="168" height="38" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="757" y="369">OpenAI / Claude</text>
      <text x="757" y="383" font-size="10.5" font-weight="500" fill="#64748B">IA</text>

      <rect x="744" y="396" width="168" height="38" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="757" y="415">GoHighLevel</text>
      <text x="757" y="429" font-size="10.5" font-weight="500" fill="#64748B">CRM / compras</text>

      <rect x="744" y="442" width="168" height="38" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="757" y="461">jsPDF + xlsx</text>
      <text x="757" y="475" font-size="10.5" font-weight="500" fill="#64748B">documentos</text>
    </g>
  </g>

  <!-- Footer accent -->
  <rect x="32" y="536" width="896" height="3" rx="1.5" fill="#E8CE86"/>
</svg>
