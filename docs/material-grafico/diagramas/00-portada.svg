<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 540" width="100%" role="img" aria-label="4Shine — Mapa visual de la plataforma" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1B2A"/>
      <stop offset="1" stop-color="#1A1F2B"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8CE86"/>
      <stop offset="1" stop-color="#D4AF37"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="960" height="540" fill="url(#bg)"/>
  <!-- marco sutil -->
  <rect x="24" y="24" width="912" height="492" rx="18" fill="none" stroke="#D4AF37" stroke-opacity="0.28"/>

  <!-- Isotipo inspirado en la marca: "4" triangular + diamante + destello -->
  <g transform="translate(120,150)" fill="none" stroke="url(#gold)" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <path d="M96 0 L8 150 L150 150"/>
    <path d="M120 44 L120 210 Q120 232 142 232 L300 232"/>
  </g>
  <!-- diamante -->
  <g transform="translate(250,150)">
    <polygon points="0,-6 18,8 0,34 -18,8" fill="url(#gold)"/>
    <polygon points="-18,8 0,-6 18,8" fill="#E8CE86"/>
    <line x1="-9" y1="8" x2="0" y2="34" stroke="#0D1B2A" stroke-opacity="0.25" stroke-width="1"/>
    <line x1="9" y1="8" x2="0" y2="34" stroke="#0D1B2A" stroke-opacity="0.25" stroke-width="1"/>
  </g>
  <!-- destello -->
  <g transform="translate(430,362)" fill="url(#gold)">
    <path d="M0,-20 C3,-6 6,-3 20,0 C6,3 3,6 0,20 C-3,6 -6,3 -20,0 C-6,-3 -3,-6 0,-20 Z"/>
  </g>

  <!-- Título -->
  <text x="500" y="180" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="88" font-weight="800" fill="url(#gold)">4Shine</text>
  <text x="502" y="232" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="600" fill="#FFFFFF">Mapa visual de la plataforma</text>
  <text x="502" y="266" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#94A3B8">Kit gráfico interno · esquemas, tablas, infografías, íconos y logo</text>

  <!-- Chips de contenido -->
  <g font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">
    <g transform="translate(500,420)"><rect width="150" height="34" rx="17" fill="#0D1B2A" stroke="#D4AF37" stroke-opacity="0.5"/><text x="75" y="22" text-anchor="middle" fill="#E8CE86">Arquitectura</text></g>
    <g transform="translate(662,420)"><rect width="150" height="34" rx="17" fill="#0D1B2A" stroke="#D4AF37" stroke-opacity="0.5"/><text x="75" y="22" text-anchor="middle" fill="#E8CE86">Base de datos</text></g>
    <g transform="translate(500,464)"><rect width="150" height="34" rx="17" fill="#0D1B2A" stroke="#D4AF37" stroke-opacity="0.5"/><text x="75" y="22" text-anchor="middle" fill="#E8CE86">5 fases</text></g>
    <g transform="translate(662,464)"><rect width="150" height="34" rx="17" fill="#0D1B2A" stroke="#D4AF37" stroke-opacity="0.5"/><text x="75" y="22" text-anchor="middle" fill="#E8CE86">Roles y acceso</text></g>
  </g>

  <text x="936" y="500" text-anchor="end" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#64748B">docs/material-grafico</text>
</svg>
