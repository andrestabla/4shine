<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="100%" role="img" aria-label="Expansion Capacity Matrix: autoevaluación de capacidad. Matriz de 6 dimensiones por 4 pilares con escala de 1 a 5.">
  <rect x="0" y="0" width="980" height="620" fill="#FFFFFF"/>

  <!-- Título -->
  <text x="48" y="56" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="700" fill="#0D1B2A">Expansion Capacity Matrix</text>
  <text x="48" y="82" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="500" fill="#64748B">autoevaluación de capacidad</text>

  <!-- Marco de la tabla -->
  <rect x="48" y="108" width="884" height="378" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Encabezado de columnas -->
  <!-- Primera columna: dimensiones (resaltada) -->
  <rect x="48" y="108" width="284" height="54" rx="12" fill="#0D1B2A"/>
  <rect x="48" y="150" width="284" height="12" fill="#0D1B2A"/>
  <text x="70" y="141" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Dimensiones</text>

  <!-- 4 pilares -->
  <text x="407" y="141" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0D1B2A">Shine Within</text>
  <text x="557" y="141" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0D1B2A">Shine Out</text>
  <text x="707" y="141" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0D1B2A">Shine Up</text>
  <text x="857" y="141" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0D1B2A">Shine Beyond</text>

  <!-- Línea bajo encabezado -->
  <line x1="48" y1="162" x2="932" y2="162" stroke="#D4AF37" stroke-width="2"/>

  <!-- Columna de dimensiones resaltada (cuerpo) -->
  <rect x="48" y="162" width="284" height="324" fill="#F4F6F9"/>

  <!-- Filas: 6 dimensiones. Cuerpo de 162 a 486 => 324 alto / 6 = 54 por fila -->
  <!-- separadores horizontales -->
  <line x1="48" y1="216" x2="932" y2="216" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="48" y1="270" x2="932" y2="270" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="48" y1="324" x2="932" y2="324" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="48" y1="378" x2="932" y2="378" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="48" y1="432" x2="932" y2="432" stroke="#E2E8F0" stroke-width="1"/>

  <!-- separadores verticales de columnas -->
  <line x1="332" y1="108" x2="332" y2="486" stroke="#D4AF37" stroke-width="1.5"/>
  <line x1="482" y1="162" x2="482" y2="486" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="632" y1="162" x2="632" y2="486" stroke="#E2E8F0" stroke-width="1"/>
  <line x1="782" y1="162" x2="782" y2="486" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Nombres de dimensiones -->
  <text x="70" y="194" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#0D1B2A">Autoliderazgo y consciencia</text>
  <text x="70" y="248" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#0D1B2A">Comunicación e influencia</text>
  <text x="70" y="302" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#0D1B2A">Estrategia e inteligencia</text>
  <text x="70" y="356" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#0D1B2A">Relaciones y conexiones</text>
  <text x="70" y="410" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#0D1B2A">Liderazgo e impacto en otros</text>
  <text x="70" y="464" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="13.5" font-weight="600" fill="#0D1B2A">Propósito y trascendencia</text>

  <!-- Celdas vacías para puntuar: circulos guía tenues, 6 filas x 4 columnas -->
  <!-- columnas centros: 407, 557, 707, 857 ; filas centros: 189,243,297,351,405,459 -->
  <g fill="none" stroke="#E2E8F0" stroke-width="1.5">
    <circle cx="407" cy="189" r="12"/><circle cx="557" cy="189" r="12"/><circle cx="707" cy="189" r="12"/><circle cx="857" cy="189" r="12"/>
    <circle cx="407" cy="243" r="12"/><circle cx="557" cy="243" r="12"/><circle cx="707" cy="243" r="12"/><circle cx="857" cy="243" r="12"/>
    <circle cx="407" cy="297" r="12"/><circle cx="557" cy="297" r="12"/><circle cx="707" cy="297" r="12"/><circle cx="857" cy="297" r="12"/>
    <circle cx="407" cy="351" r="12"/><circle cx="557" cy="351" r="12"/><circle cx="707" cy="351" r="12"/><circle cx="857" cy="351" r="12"/>
    <circle cx="407" cy="405" r="12"/><circle cx="557" cy="405" r="12"/><circle cx="707" cy="405" r="12"/><circle cx="857" cy="405" r="12"/>
    <circle cx="407" cy="459" r="12"/><circle cx="557" cy="459" r="12"/><circle cx="707" cy="459" r="12"/><circle cx="857" cy="459" r="12"/>
  </g>

  <!-- Leyenda escala 1-5 -->
  <text x="48" y="528" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0D1B2A">Escala de capacidad</text>

  <!-- chips: degradado gris a dorado -->
  <!-- 1 -->
  <g>
    <rect x="48" y="548" width="168" height="46" rx="10" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="70" cy="571" r="9" fill="#CBD5E1"/>
    <text x="86" y="569" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0D1B2A">1</text>
    <text x="86" y="583" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#64748B">Limitada</text>
  </g>
  <!-- 2 -->
  <g>
    <rect x="230" y="548" width="168" height="46" rx="10" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="252" cy="571" r="9" fill="#B9A67A"/>
    <text x="268" y="569" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0D1B2A">2</text>
    <text x="268" y="583" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#64748B">En desarrollo</text>
  </g>
  <!-- 3 -->
  <g>
    <rect x="412" y="548" width="168" height="46" rx="10" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="434" cy="571" r="9" fill="#D9C48F"/>
    <text x="450" y="569" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0D1B2A">3</text>
    <text x="450" y="583" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#64748B">Sólida</text>
  </g>
  <!-- 4 -->
  <g>
    <rect x="594" y="548" width="168" height="46" rx="10" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="616" cy="571" r="9" fill="#E8CE86"/>
    <text x="632" y="569" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0D1B2A">4</text>
    <text x="632" y="583" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#64748B">Fuerte</text>
  </g>
  <!-- 5 -->
  <g>
    <rect x="776" y="548" width="156" height="46" rx="10" fill="#F4F6F9" stroke="#D4AF37" stroke-width="1.5"/>
    <circle cx="798" cy="571" r="9" fill="#D4AF37"/>
    <text x="814" y="569" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0D1B2A">5</text>
    <text x="814" y="583" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#64748B">Expansionada</text>
  </g>
</svg>
