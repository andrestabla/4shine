<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" role="img" aria-label="Arquitectura del modelo 4Shine: expansion concentrica de 4 niveles (4 pilares, 22 componentes, 47 competencias, 96 conductas observables) con desglose por pilar.">
  <rect x="0" y="0" width="960" height="560" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="40" y="46" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="700" fill="#0D1B2A">Arquitectura del modelo — de la dimensión a la conducta</text>
  <text x="40" y="72" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="400" fill="#64748B">Expansión concéntrica en 4 niveles, del centro hacia afuera.</text>

  <!-- Concentric rings -->
  <g>
    <!-- Ring 4: Conducta observable (outermost) -->
    <circle cx="255" cy="300" r="150" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1.5"/>
    <!-- Ring 3: Competencia -->
    <circle cx="255" cy="300" r="115" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <!-- Ring 2: Componente -->
    <circle cx="255" cy="300" r="78" fill="#1A1F2B" stroke="#0D1B2A" stroke-width="1.5"/>
    <!-- Ring 1: Pilar (center) -->
    <circle cx="255" cy="300" r="42" fill="#0D1B2A" stroke="#D4AF37" stroke-width="2.5"/>

    <!-- Center label -->
    <text x="255" y="294" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="700" fill="#D4AF37">4</text>
    <text x="255" y="314" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="600" fill="#E8CE86">Pilares</text>

    <!-- Ring 2 label -->
    <text x="255" y="238" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#E8CE86">22</text>
    <text x="255" y="253" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">Componentes</text>

    <!-- Ring 3 label -->
    <text x="255" y="200" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#D4AF37">47</text>
    <text x="255" y="215" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="600" fill="#0D1B2A">Competencias</text>

    <!-- Ring 4 label -->
    <text x="255" y="166" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="700" fill="#0D1B2A">96</text>
    <text x="255" y="181" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748B">Conductas observables</text>
  </g>

  <!-- Legend / step ladder on the right -->
  <g>
    <text x="470" y="128" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#64748B" letter-spacing="1">NIVELES DEL MODELO</text>

    <!-- Step 1 -->
    <rect x="470" y="146" width="10" height="10" rx="2" fill="#0D1B2A"/>
    <text x="492" y="155" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0D1B2A">Pilar</text>
    <text x="640" y="155" text-anchor="end" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0D1B2A">4</text>

    <!-- Step 2 -->
    <rect x="470" y="176" width="10" height="10" rx="2" fill="#1A1F2B"/>
    <text x="492" y="185" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0D1B2A">Componente</text>
    <text x="640" y="185" text-anchor="end" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0D1B2A">22</text>

    <!-- Step 3 -->
    <rect x="470" y="206" width="10" height="10" rx="2" fill="#D4AF37"/>
    <text x="492" y="215" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0D1B2A">Competencia</text>
    <text x="640" y="215" text-anchor="end" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0D1B2A">47</text>

    <!-- Step 4 -->
    <rect x="470" y="236" width="10" height="10" rx="2" fill="#E8CE86"/>
    <text x="492" y="245" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0D1B2A">Conducta obs.</text>
    <text x="640" y="245" text-anchor="end" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="700" fill="#0D1B2A">96</text>

    <line x1="470" y1="262" x2="660" y2="262" stroke="#E2E8F0" stroke-width="1"/>
    <text x="470" y="284" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" fill="#64748B">Cada competencia se despliega en conductas</text>
    <text x="470" y="300" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="400" fill="#64748B">observables (“El líder…”).</text>
  </g>

  <!-- Breakdown table -->
  <g>
    <!-- Header row -->
    <rect x="40" y="378" width="880" height="34" rx="8" fill="#0D1B2A"/>
    <text x="60" y="400" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Pilar</text>
    <text x="560" y="400" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#E8CE86">Componentes</text>
    <text x="700" y="400" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#E8CE86">Competencias</text>
    <text x="850" y="400" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#E8CE86">Conductas</text>

    <!-- Row: Shine Within -->
    <text x="60" y="435" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0D1B2A">Shine Within</text>
    <text x="560" y="435" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="400" fill="#0D1B2A">7</text>
    <text x="700" y="435" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="400" fill="#0D1B2A">15</text>
    <text x="850" y="435" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="400" fill="#0D1B2A">32</text>
    <line x1="40" y1="446" x2="920" y2="446" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Row: Shine Out -->
    <text x="60" y="466" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0D1B2A">Shine Out</text>
    <text x="560" y="466" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="400" fill="#0D1B2A">4</text>
    <text x="700" y="466" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="400" fill="#0D1B2A">8</text>
    <text x="850" y="466" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="400" fill="#0D1B2A">16</text>
    <line x1="40" y1="477" x2="920" y2="477" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Row: Shine Up -->
    <text x="60" y="497" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0D1B2A">Shine Up</text>
    <text x="560" y="497" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="400" fill="#0D1B2A">6</text>
    <text x="700" y="497" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="400" fill="#0D1B2A">13</text>
    <text x="850" y="497" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="400" fill="#0D1B2A">26</text>
    <line x1="40" y1="508" x2="920" y2="508" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Row: Shine Beyond -->
    <text x="60" y="528" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0D1B2A">Shine Beyond</text>
    <text x="560" y="528" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="400" fill="#0D1B2A">5</text>
    <text x="700" y="528" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="400" fill="#0D1B2A">11</text>
    <text x="850" y="528" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="400" fill="#0D1B2A">22</text>

    <!-- TOTAL row (highlighted) -->
    <rect x="40" y="536" width="880" height="20" rx="6" fill="#F4F6F9"/>
    <text x="60" y="551" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0D1B2A">TOTAL</text>
    <text x="560" y="551" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0D1B2A">22</text>
    <text x="700" y="551" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0D1B2A">47</text>
    <text x="850" y="551" text-anchor="middle" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#0D1B2A">96</text>
  </g>
</svg>
