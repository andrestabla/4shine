<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" role="img" aria-label="Módulos de 4Shine: hoja de íconos de los 18 módulos de la plataforma">
  <rect x="0" y="0" width="960" height="620" fill="#FFFFFF"/>

  <!-- Header -->
  <rect x="40" y="30" width="6" height="30" rx="3" fill="#D4AF37"/>
  <text x="60" y="47" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="700" fill="#0D1B2A">Módulos de 4Shine</text>
  <text x="60" y="70" font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="500" fill="#64748B">Hoja de íconos line-art · un ícono por módulo de la plataforma</text>

  <!-- ============ CARDS ============ -->
  <!-- Card backgrounds + badges (6 columns x 3 rows) -->
  <g>
    <!-- Row 1 -->
    <rect x="40"  y="100" width="130" height="145" rx="12" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="190" y="100" width="130" height="145" rx="12" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="340" y="100" width="130" height="145" rx="12" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="490" y="100" width="130" height="145" rx="12" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="640" y="100" width="130" height="145" rx="12" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="790" y="100" width="130" height="145" rx="12" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/>
    <!-- Row 2 -->
    <rect x="40"  y="260" width="130" height="145" rx="12" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="190" y="260" width="130" height="145" rx="12" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="340" y="260" width="130" height="145" rx="12" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="490" y="260" width="130" height="145" rx="12" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="640" y="260" width="130" height="145" rx="12" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="790" y="260" width="130" height="145" rx="12" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/>
    <!-- Row 3 -->
    <rect x="40"  y="420" width="130" height="145" rx="12" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="190" y="420" width="130" height="145" rx="12" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="340" y="420" width="130" height="145" rx="12" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="490" y="420" width="130" height="145" rx="12" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="640" y="420" width="130" height="145" rx="12" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="790" y="420" width="130" height="145" rx="12" fill="#F4F6F9" stroke="#E2E8F0" stroke-width="1"/>
  </g>

  <!-- Navy badges behind each icon (centered at cx,cy) -->
  <g fill="#0D1B2A">
    <rect x="78"  y="121" width="54" height="54" rx="14"/>
    <rect x="228" y="121" width="54" height="54" rx="14"/>
    <rect x="378" y="121" width="54" height="54" rx="14"/>
    <rect x="528" y="121" width="54" height="54" rx="14"/>
    <rect x="678" y="121" width="54" height="54" rx="14"/>
    <rect x="828" y="121" width="54" height="54" rx="14"/>

    <rect x="78"  y="281" width="54" height="54" rx="14"/>
    <rect x="228" y="281" width="54" height="54" rx="14"/>
    <rect x="378" y="281" width="54" height="54" rx="14"/>
    <rect x="528" y="281" width="54" height="54" rx="14"/>
    <rect x="678" y="281" width="54" height="54" rx="14"/>
    <rect x="828" y="281" width="54" height="54" rx="14"/>

    <rect x="78"  y="441" width="54" height="54" rx="14"/>
    <rect x="228" y="441" width="54" height="54" rx="14"/>
    <rect x="378" y="441" width="54" height="54" rx="14"/>
    <rect x="528" y="441" width="54" height="54" rx="14"/>
    <rect x="678" y="441" width="54" height="54" rx="14"/>
    <rect x="828" y="441" width="54" height="54" rx="14"/>
  </g>

  <!-- ============ ICONS (line-art gold) ============ -->
  <g fill="none" stroke="#D4AF37" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">

    <!-- 1. Aprendizaje — libro / open book (105,148) -->
    <g transform="translate(105,148)">
      <path d="M0,-9 C -3,-11 -8,-11 -11,-10 L -11,8 C -8,7 -3,7 0,9"/>
      <path d="M0,-9 C 3,-11 8,-11 11,-10 L 11,8 C 8,7 3,7 0,9"/>
      <path d="M0,-9 L0,9"/>
    </g>

    <!-- 2. Mentorías — cámara de video (255,148) -->
    <g transform="translate(255,148)">
      <rect x="-12" y="-7" width="15" height="14" rx="2.5"/>
      <path d="M3,-2 L11,-6 L11,6 L3,2 Z"/>
    </g>

    <!-- 3. Descubrimiento — brújula (405,148) -->
    <g transform="translate(405,148)">
      <circle cx="0" cy="0" r="11"/>
      <path d="M4,-4 L-1,-1 L-4,4 L1,1 Z"/>
      <circle cx="0" cy="0" r="1"/>
    </g>

    <!-- 4. Networking — personas (555,148) -->
    <g transform="translate(555,148)">
      <circle cx="-3" cy="-4" r="3.4"/>
      <path d="M-10,8 C -10,1 4,1 4,8"/>
      <circle cx="7" cy="-6" r="2.8"/>
      <path d="M6,2 C 10,2 12,5 12,8"/>
    </g>

    <!-- 5. Convocatorias — maletín (705,148) -->
    <g transform="translate(705,148)">
      <rect x="-11" y="-4" width="22" height="13" rx="2.5"/>
      <path d="M-4,-4 L-4,-8 Q-4,-9 -3,-9 L3,-9 Q4,-9 4,-8 L4,-4"/>
      <path d="M-11,2 L11,2"/>
    </g>

    <!-- 6. Mensajes — bocadillo de chat (855,148) -->
    <g transform="translate(855,148)">
      <path d="M-11,-8 L11,-8 Q13,-8 13,-6 L13,3 Q13,5 11,5 L-3,5 L-8,9 L-8,5 L-11,5 Q-13,5 -13,3 L-13,-6 Q-13,-8 -11,-8 Z"/>
      <circle cx="-5" cy="-1.5" r="0.9" fill="#D4AF37" stroke="none"/>
      <circle cx="0"  cy="-1.5" r="0.9" fill="#D4AF37" stroke="none"/>
      <circle cx="5"  cy="-1.5" r="0.9" fill="#D4AF37" stroke="none"/>
    </g>

    <!-- 7. Workshops — pizarra / presentación (105,308) -->
    <g transform="translate(105,308)">
      <rect x="-12" y="-9" width="24" height="15" rx="2"/>
      <path d="M-6,1 L-2,-2 L2,0 L6,-4"/>
      <path d="M0,6 L0,10"/>
      <path d="M-4,13 L0,10 L4,13"/>
    </g>

    <!-- 8. Líderes — usuario + engranaje (255,308) -->
    <g transform="translate(255,308)">
      <circle cx="-2" cy="-6" r="3.4"/>
      <path d="M-10,5 C -10,-1 6,-1 6,5"/>
      <circle cx="7" cy="7" r="3.6"/>
      <path d="M7,2.5 L7,4 M7,10 L7,11.5 M2.5,7 L4,7 M10,7 L11.5,7"/>
    </g>

    <!-- 9. Notificaciones — campana (405,308) -->
    <g transform="translate(405,308)">
      <path d="M0,-10 C 5,-10 8,-6 8,-1 L8,3 L10,6 L-10,6 L-8,3 L-8,-1 C -8,-6 -5,-10 0,-10 Z"/>
      <path d="M-3,6 A3,3 0 0 0 3,6"/>
      <path d="M0,-10 L0,-12"/>
    </g>

    <!-- 10. Analítica — barras (555,308) -->
    <g transform="translate(555,308)">
      <path d="M-12,9 L12,9"/>
      <rect x="-10" y="1"  width="5" height="8"/>
      <rect x="-2"  y="-6" width="5" height="15"/>
      <rect x="6"   y="-3" width="5" height="12"/>
    </g>

    <!-- 11. Planes — tarjeta (705,308) -->
    <g transform="translate(705,308)">
      <rect x="-12" y="-8" width="24" height="16" rx="2.5"/>
      <path d="M-12,-3 L12,-3"/>
      <path d="M-8,3 L-1,3"/>
    </g>

    <!-- 12. Usuarios — engranaje / ajustes (855,308) -->
    <g transform="translate(855,308)">
      <circle cx="0" cy="0" r="4.5"/>
      <path d="M0,-11 L0,-7 M0,7 L0,11 M-11,0 L-7,0 M7,0 L11,0 M-7.8,-7.8 L-5,-5 M5,5 L7.8,7.8 M7.8,-7.8 L5,-5 M-5,5 L-7.8,7.8"/>
    </g>

    <!-- 13. Contenido — carpeta (105,468) -->
    <g transform="translate(105,468)">
      <path d="M-12,-6 L-3,-6 L-1,-3 L11,-3 Q12,-3 12,-2 L12,6 Q12,7 11,7 L-11,7 Q-12,7 -12,6 Z"/>
    </g>

    <!-- 14. Trayectoria — mapa (255,468) -->
    <g transform="translate(255,468)">
      <path d="M-12,-7 L-4,-9 L4,-7 L12,-9 L12,7 L4,9 L-4,7 L-12,9 Z"/>
      <path d="M-4,-9 L-4,7"/>
      <path d="M4,-7 L4,9"/>
    </g>

    <!-- 15. Perfil — credencial (405,468) -->
    <g transform="translate(405,468)">
      <rect x="-10" y="-9" width="20" height="18" rx="2.5"/>
      <path d="M-2,-9 L-2,-11 L2,-11 L2,-9"/>
      <rect x="-6" y="-4" width="6" height="6" rx="1"/>
      <path d="M3,-3 L7,-3 M3,0 L7,0"/>
      <path d="M-6,5 L7,5"/>
    </g>

    <!-- 16. Site Builder — globo (555,468) -->
    <g transform="translate(555,468)">
      <circle cx="0" cy="0" r="11"/>
      <path d="M0,-11 C -6,-6 -6,6 0,11"/>
      <path d="M0,-11 C 6,-6 6,6 0,11"/>
      <path d="M-11,0 L11,0"/>
      <path d="M-9,-5 L9,-5 M-9,5 L9,5"/>
    </g>

    <!-- 17. Formación Advisors — birrete (705,468) -->
    <g transform="translate(705,468)">
      <path d="M0,-8 L13,-3 L0,2 L-13,-3 Z"/>
      <path d="M-6,-0.5 L-6,5 C -6,8 6,8 6,5 L6,-0.5"/>
      <path d="M13,-3 L13,5"/>
      <circle cx="13" cy="6" r="1.3" fill="#D4AF37" stroke="none"/>
    </g>

    <!-- 18. Asistente IA — robot (855,468) -->
    <g transform="translate(855,468)">
      <rect x="-9" y="-6" width="18" height="15" rx="3.5"/>
      <path d="M0,-6 L0,-10"/>
      <circle cx="0" cy="-11" r="1.4" fill="#D4AF37" stroke="none"/>
      <circle cx="-3.5" cy="0" r="1.3" fill="#D4AF37" stroke="none"/>
      <circle cx="3.5"  cy="0" r="1.3" fill="#D4AF37" stroke="none"/>
      <path d="M-3.5,4.5 L3.5,4.5"/>
      <path d="M-9,-1 L-12,-1 M9,-1 L12,-1"/>
    </g>

  </g>

  <!-- ============ LABELS (navy) ============ -->
  <g font-family="Manrope, ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#0D1B2A" text-anchor="middle">
    <!-- Row 1 (y=196) -->
    <text x="105" y="196">Aprendizaje</text>
    <text x="255" y="196">Mentorías</text>
    <text x="405" y="196">Descubrimiento</text>
    <text x="555" y="196">Networking</text>
    <text x="705" y="196">Convocatorias</text>
    <text x="855" y="196">Mensajes</text>
    <!-- Row 2 (y=356) -->
    <text x="105" y="356">Workshops</text>
    <text x="255" y="356">Líderes</text>
    <text x="405" y="356">Notificaciones</text>
    <text x="555" y="356">Analítica</text>
    <text x="705" y="356">Planes</text>
    <text x="855" y="356">Usuarios</text>
    <!-- Row 3 (y=516) -->
    <text x="105" y="516">Contenido</text>
    <text x="255" y="516">Trayectoria</text>
    <text x="405" y="516">Perfil</text>
    <text x="555" y="516">Site Builder</text>
    <text x="705" y="512">Formación</text>
    <text x="705" y="527">Advisors</text>
    <text x="855" y="516">Asistente IA</text>
  </g>

  <!-- Footer accent -->
  <rect x="40" y="590" width="880" height="3" rx="1.5" fill="#E8CE86"/>
</svg>
